name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version component to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch
      prerelease:
        description: "Prerelease type (none = stable release)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - a
          - b
          - rc
      prerelease_number:
        description: "Prerelease number (only used when prerelease != none)"
        required: false
        default: "1"

permissions:
  contents: write

jobs:
  release:
    name: Bump version and release
    runs-on: ubuntu-latest
    # Skip if PR was closed without merging
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine bump type
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "bump_type=${{ inputs.bump_type }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
            echo "prerelease_number=${{ inputs.prerelease_number }}" >> $GITHUB_OUTPUT
            echo "Triggered manually: bump=${{ inputs.bump_type }}"
          else
            LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
            echo "PR labels: $LABELS"
            if [[ "$LABELS" == *"major"* ]]; then
              BUMP="major"
            elif [[ "$LABELS" == *"minor"* ]]; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
            echo "bump_type=$BUMP" >> $GITHUB_OUTPUT
            echo "prerelease=none" >> $GITHUB_OUTPUT
            echo "prerelease_number=1" >> $GITHUB_OUTPUT
            echo "Detected bump type from labels: $BUMP"
          fi

      - name: Compute new version
        id: ver
        run: |
          python3 - <<'PYEOF'
          import re, os

          with open("pyproject.toml") as f:
              content = f.read()

          m = re.search(r'^version\s*=\s*"([^"]+)"', content, re.MULTILINE)
          if not m:
              raise RuntimeError("Could not find version in pyproject.toml")
          current = m.group(1)

          base = re.sub(r"(a|b|rc)\d+$", "", current)
          parts = base.split(".")
          major, minor, patch = int(parts[0]), int(parts[1]), int(parts[2])

          bump = os.environ["BUMP_TYPE"]
          if bump == "major":
              major += 1; minor = 0; patch = 0
          elif bump == "minor":
              minor += 1; patch = 0
          else:
              patch += 1

          new = f"{major}.{minor}.{patch}"

          pre = os.environ["PRERELEASE"]
          pre_num = os.environ["PRERELEASE_NUMBER"]
          if pre != "none":
              new = f"{new}{pre}{pre_num}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"new_version={new}\n")

          print(f"Current: {current}  →  New: {new}")
          PYEOF
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.bump_type }}
          PRERELEASE: ${{ steps.bump.outputs.prerelease }}
          PRERELEASE_NUMBER: ${{ steps.bump.outputs.prerelease_number }}

      - name: Update version files
        run: |
          VERSION="${{ steps.ver.outputs.new_version }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" polarisation_ui/__init__.py
          jq --arg v "$VERSION" '. + {"version": $v}' \
            polarisation_ui/config.json > /tmp/cfg.json && mv /tmp/cfg.json polarisation_ui/config.json
          echo "Updated all version files to $VERSION"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Commit and tag
        run: |
          VERSION="${{ steps.ver.outputs.new_version }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pyproject.toml polarisation_ui/__init__.py polarisation_ui/config.json
          git commit -m "chore: bump version to v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"
          echo "Pushed commit and tag v$VERSION"

      - name: Detect prerelease
        id: pre
        run: |
          if echo "${{ steps.ver.outputs.new_version }}" | grep -qE "(a|b|rc)[0-9]+$"; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.new_version }}
          name: Release v${{ steps.ver.outputs.new_version }}
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          generate_release_notes: true
          body: |
            ## Polarisation-UI v${{ steps.ver.outputs.new_version }}

            Desktop application for polarisation experiments — reads two magnetic encoder
            angles and ADS1220 photodiode intensity over SCPI from an Arduino Nano ESP32.

            ### Installation

            ```bash
            pip install git+https://github.com/cckssr/polarisation-ui.git@v${{ steps.ver.outputs.new_version }}
            ```

            See the [README](https://github.com/cckssr/polarisation-ui#readme) for hardware requirements.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ steps.ver.outputs.new_version }}"
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`v$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bump type** | ${{ steps.bump.outputs.bump_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
