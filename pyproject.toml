[build-system]
requires = ["setuptools>=77.0", "wheel"]  # 77: SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.per-file-ignores]
# Vendored from PyMeasure (MIT) — not our style to enforce.
"polarisation_ui/infrastructure/modules/pm400.py" = ["E", "F", "I", "UP", "B", "D"]
# pyuic6-generated — regenerated from .ui sources, never hand-edited.
"polarisation_ui/pyqt/ui_*.py" = ["E", "F", "I", "UP", "B", "D"]
# Test names are self-documenting (test_reads_angle_a needs no docstring
# restating "reads angle a"); still enforce E/F/I/UP/B in tests.
"tests/**" = ["D"]
"calibration_tool/tests/**" = ["D"]

[project]
name = "Polarisation-UI"
version = "1.1.6"
description = "Polarisation-UI: A GUI application for polarisation experiments with manual goniometers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Cedric Kessler", email = "c.kessler@tu-berlin.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "pyqtgraph>=0.13.0",
    "pyserial>=3.5",
]


[project.optional-dependencies]
calibration = [
    "pylablib>=1.4.0",
    "pymeasure>=0.13.0",
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
]

docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-napoleon>=0.7",
]

dev = [
    "ruff>=0.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "build>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/cckssr/polarisation-ui"
Documentation = "https://polarisation-ui.readthedocs.io"
Repository = "https://github.com/cckssr/polarisation-ui"
Issues = "https://github.com/cckssr/polarisation-ui/issues"

[project.gui-scripts]
polarisation-ui = "polarisation_ui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polarisation_ui", "polarisation_ui.*"]
exclude = [
    "polarisation_ui.infrastructure.mocks",
    "polarisation_ui.infrastructure.mocks.*",
]

[tool.setuptools.package-data]
"polarisation_ui" = ["pyqt/*.ui", "config.json", "sensor_metadata.json"]

[tool.pyside6-project]
# Project file for Qt Creator (File > Open File or Project > pyproject.toml). Qt Creator does not
# discover new files, so add every new .ui form here. "Run" starts preview.py: it asks for a
# form and shows it with the config.json texts, without controllers, devices or the
# infrastructure layer, and reloads on save. Regenerate ui_*.py with polarisation_ui/pyqt/pyuic.sh,
# not `pyside6-project build`: that skips the config.json text sync and the ruff formatting.
files = [
    "polarisation_ui/pyqt/acq_settings.ui",
    "polarisation_ui/pyqt/arduino_panel.ui",
    "polarisation_ui/pyqt/auto_power_calibration.ui",
    "polarisation_ui/pyqt/brewster_tab.ui",
    "polarisation_ui/pyqt/detector_panel.ui",
    "polarisation_ui/pyqt/ellipsometry_tab.ui",
    "polarisation_ui/pyqt/encoder_debug.ui",
    "polarisation_ui/pyqt/event_log_panel.ui",
    "polarisation_ui/pyqt/kdc_panel.ui",
    "polarisation_ui/pyqt/log_window.ui",
    "polarisation_ui/pyqt/main_window.ui",
    "polarisation_ui/pyqt/malus_tab.ui",
    "polarisation_ui/pyqt/measurement_panel.ui",
    "polarisation_ui/pyqt/power_calibration.ui",
    "polarisation_ui/pyqt/power_calibration_gain_tab.ui",
    "polarisation_ui/pyqt/power_drift_tab.ui",
    "polarisation_ui/pyqt/readout_panel.ui",
    "polarisation_ui/pyqt/save_panel.ui",
    "polarisation_ui/pyqt/stage_panel.ui",
    "polarisation_ui/pyqt/waveplate_tab.ui",
    "polarisation_ui/pyqt/preview.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.coverage.run]
source = ["polarisation_ui"]
omit = ["polarisation_ui/pyqt/ui_*.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
