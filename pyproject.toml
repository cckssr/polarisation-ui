[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = ["D"]

[project]
name = "Polarisation-UI"
version = "1.1.1"
description = "Polarisation-UI: A GUI application for polarisation experiments with manual goniometers."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Cedric Kessler", email = "c.kessler@tu-berlin.de"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "PySide6>=6.5.0",
    "numpy>=1.24.0",
    "pyqtgraph>=0.13.0",
    "pyserial>=3.5",
]


[project.optional-dependencies]
calibration = [
    "pylablib>=1.4.0",
    "pymeasure>=0.13.0",
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
]

docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxcontrib-napoleon>=0.7",
]

dev = [
    "ruff>=0.4.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "build>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/cckssr/polarisation-ui"
Documentation = "https://polarisation-ui.readthedocs.io"
Repository = "https://github.com/cckssr/polarisation-ui"
Issues = "https://github.com/cckssr/polarisation-ui/issues"

[project.gui-scripts]
polarisation-ui = "polarisation_ui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["polarisation_ui", "polarisation_ui.*"]
exclude = [
    "polarisation_ui.infrastructure.mocks",
    "polarisation_ui.infrastructure.mocks.*",
]

[tool.setuptools.package-data]
"polarisation_ui" = ["pyqt/*.ui", "config.json", "sensor_metadata.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["."]
