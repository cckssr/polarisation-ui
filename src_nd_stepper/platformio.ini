; ND-filter stepper controller: generic ESP32 + DRV8825 driving an axial
; (rotary) variable ND filter. Independent of the encoder/ADC firmware in
; ../src_arduino. Build and flash from this directory: `pio run -t upload`.

[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
; ESP32 DevKit V1 (ESP-WROOM-32). Change `board` for a different module.
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps =
  waspinator/AccelStepper@^1.64
build_flags =
  -I../src_arduino/src
