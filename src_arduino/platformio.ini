; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` (no -e) only builds the firmware. native_test is a Unity test
; environment: Unity is fetched as a test-scoped dependency by `pio test`,
; not by a plain build, so `pio run -e native_test` fails with a missing
; unity.h — always exercise it via `pio test -e native_test` instead.
default_envs = arduino_nano_esp32

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_echo = yes

[env:native_test]
platform = native
framework = 
test_framework = unity
build_flags = 
  -std=c++17
  -DUNIT_TEST
  -Wall -Wextra
build_src_filter = 
  -<*>
  +<../test>